<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CIPHER — Communities</title>
  <link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/communities.css">
</head>
<body>
  <header class="topnav">
    <div class="brand">CIPHER</div>
    <nav>
      <a href="/">Overview</a>
      <a href="/cases">Case Manager</a>
      <a href="/network-graph">Network Graph</a>
      <a href="/key-influencers">Key Influencers</a>
      <a href="/risk-scoring">Risk Scoring</a>
      <a href="/alerts">Alerts</a>
      <a href="/hidden-links">Hidden Links</a>
      <a href="/communities" class="active">Communities</a>
    </nav>
    <a href="/auth/logout" class="logout">Logout</a>
  </header>

  <main class="layout">
    <aside class="filters">
      <h3>Filters</h3>
      <label>Dominant type
        <select id="filter-type">
          <option value="">All types</option>
          <option value="Person">Person</option>
          <option value="Account">Account</option>
          <option value="Vehicle">Vehicle</option>
          <option value="Phone">Phone</option>
          <option value="Location">Location</option>
        </select>
      </label>
      <label>Has suspect
        <select id="filter-suspect">
          <option value="">Any</option>
          <option value="true">Yes</option>
          <option value="false">No</option>
        </select>
      </label>
      <label>Minimum size
        <input type="number" id="filter-min-size" placeholder="e.g. 10">
      </label>
      <button id="apply-btn">Apply</button>
      <button id="reset-btn" class="secondary">Reset</button>
      <p class="total-count">Total matching: <span id="total-count">0</span></p>
    </aside>

    <section class="list-panel" id="community-list"></section>

    <aside class="detail-panel" id="detail-panel">
      <p class="empty-state">Select a community to see its full member list</p>
    </aside>
  </main>

  <script src="/static/communities.js"></script>
</body>
</html>
